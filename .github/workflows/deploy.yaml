name: Deploy NodeJS Application to Hostinger

on:
  push:
    branches:
      - main


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with: 
          host: ${{ secrets.SSH_HOST }}   # Add server public ip address and store it in the secrets on GitHub
          username: root
          key: ${{ secrets.SSH_KEY}}    # ran the command (ssh-keygen -t rsa -b 4096 -C "aws@navishgoyal.dev") to get private and public keys. put private keu in the secrets on GitHub and public key in the server's authorized_keys file in .ssh folder
          script: |
            cd /root/nodejs-application-deploy-github-actions
            git pull
            docker compose up -d --build